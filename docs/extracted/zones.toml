# Which parts of the tree agents may edit.
#
#   hand    agents may READ and may PROPOSE, never edit. Your learning surface.
#           Enforced by the pre-commit hook (aw install-hooks).
#   assist  agents edit, you review every diff line by line.
#   auto    agents edit, you review the summary.
#
# Review changes to this file as carefully as you would a security policy.
# Zone creep is the quiet failure mode of this system.

[hand]
reason = "Rust learning surface + DSP numerical correctness. Type system does not cover these."
paths = [
  "crates/audat-dsp/src/**",
  "crates/audat-core/src/restore/**",
]

[assist]
reason = "Structural code. Compiler catches most of what a cheap model gets wrong."
paths = [
  "crates/audat-cli/**",
  "crates/audat-io/**",
  "crates/*/tests/**",
  "crates/*/benches/**",
]

[auto]
reason = "Mechanical. Review the summary, not the diff."
paths = [
  "xtask/**",
  "docs/**",
  "**/fixtures/**",
  ".github/**",
]
